openapi: 3.0.3
info:
  title: Freedger API
  description: API for Ditto integration with Azure Functions
  version: 1.0.0
servers:
  - url: http://localhost:7071/api
    description: Local development server
  - url: https://freedger-api-ejfze9a8bzbfd7au.eastasia-01.azurewebsites.net/api
    description: Development server

paths:
  /ditto/authorize:
    post:
      tags:
        - Ditto
      summary: Authorize Ditto webhook request
      description: |
        Validates the Ditto webhook authentication request and returns the user's permissions.
        This endpoint is called by Ditto to verify user permissions for data access.
      operationId: dittoAuthorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Successful authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
              examples:
                errorResponse:
                  value:
                    authenticate: false
        '401':
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
              examples:
                errorResponse:
                  value:
                    authenticate: false
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
              examples:
                errorResponse:
                  value:
                    authenticate: false
  /ledgers:
    post:
      security:
        - bearerAuth: []
      tags:
        - Ledgers
      summary: Create a new ledger
      description: |
        Creates a new ledger for the authenticated user.
        
        ### Authentication
        This endpoint requires a valid JWT token in the Authorization header.
        
        **Example:**
        ```
        Authorization: Bearer <your_jwt_token>
        ```
      operationId: createLedger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedger'
      responses:
        '201':
          description: Ledger created successfully
          headers:
            X-TXN-ID:
              schema:
                $ref: '#/components/schemas/TransactionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ledgers/{ledgerId}:
    put:
      security:
        - bearerAuth: []
      tags:
        - Ledgers
      summary: Update a ledger
      description: |
        Updates a ledger for the authenticated user.
        
        ### Authentication
        This endpoint requires a valid JWT token in the Authorization header.
        
        **Example:**
        ```
        Authorization: Bearer <your_jwt_token>
        ```
      operationId: updateLedger
      parameters:
        - name: ledgerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLedger'
      responses:
        '200':
          description: Ledger updated successfully
          headers:
            X-TXN-ID:
              schema:
                $ref: '#/components/schemas/TransactionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme

  schemas:
    TransactionId:
      description: |
        Transaction ID for an update or create operation.  
        When doing an update or create operation, a transaction ID will be returned in the response. 
        If you want to retrieve the data while ensuring that the data is consistent with the transaction, 
        you can use the transaction ID in the request for retrieval.
      type: string
    ErrorResponse:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: The error code
        message:
          type: string
          description: The error message
          example: "Invalid scope"
    ErrorCode:
      type: string
      enum:
        - invalidRequest
        - notFound
        - unauthorized
        - serverError
      # Ask the generated code to use SNAKE_CASE for the enum names
      x-enum-varnames:
        - INVALID_REQUEST
        - NOT_FOUND
        - UNAUTHORIZED
        - SERVER_ERROR

    Ledger:
      type: object
      required:
        - createdAt
        - updatedAt
        - name
        - readerIds
        - writerIds
        - note
        - currencyId
        - externalAccountId
      properties:
        id:
          type: string
          description: The ID of the ledger
          example: "0123456789"
        createdAt:
          type: string
          format: date-time
          description: The creation time of the ledger
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: The update time of the ledger
          example: "2023-01-01T00:00:00Z"
        name:
          type: string
          description: The name of the ledger
          example: "My Ledger"
        readerIds:
          type: array
          items:
            type: string
          description: The IDs of the readers of the ledger
          example: ["user-123", "user-456"]
        writerIds:
          type: array
          items:
            type: string
          description: The IDs of the writers of the ledger
          example: ["user-123", "user-456"]
        note:
          type: string
          description: The note of the ledger
          example: "This is my ledger"
        currencyId:
          type: string
          description: |
            The ID of the default currency. 
            The currency will be used as the default currency when creating a transaction.
          example: "0123456789"
        externalAccountId:
          type: string
          description: |
            The ID of the default external account. 
            The external account will be used as the default external account when creating a transaction.
          example: "0123456789"

    CreateLedger:
      type: object
      description: |
        The configuration for creating a new ledger.
        The authorized user will be set as the writer of the ledger.
      required:
        - name
        - note
        - currencyId
        - externalAccountName
      properties:
        name:
          type: string
          description: The name of the ledger
          example: "My Ledger"
        note:
          type: string
          description: The note of the ledger
          example: "This is my ledger"
        currencyId:
          type: string
          description: |
            The ID of the default currency. 
            The currency will be used as the default currency when creating a transaction.
          example: "0123456789"
        externalAccountName:
          type: string
          description: |
            The name of the default external account. 
            A "counterparty" account will be created with the name, and the account will be used as the default
            external account when creating a transaction.
          example: "Unspecified"

    UpdateLedger:
      type: object
      description: |
        The configuration for updating a ledger.
        The authorized user will be set as the writer of the ledger.
      required:
        - name
        - note
        - currencyId
        - externalAccountId
        - readerIds
        - writerIds
      properties:
        name:
          type: string
          description: The name of the ledger
          example: "My Ledger"
        note:
          type: string
          description: The note of the ledger
          example: "This is my ledger"
        currencyId:
          type: string
          description: |
            The ID of the default currency. 
            The currency will be used as the default currency when creating a transaction.
          example: "0123456789"
        externalAccountId:
          type: string
          description: |
            The ID of the default external account. 
            The external account will be used as the default external account when creating a transaction.
          example: "0123456789"
        readerIds:
          type: array
          items:
            type: string
          description: The IDs of the readers of the ledger
          example: ["user-123", "user-456"]
        writerIds:
          type: array
          items:
            type: string
          description: The IDs of the writers of the ledger
          example: ["user-123", "user-456"]
    AuthorizeRequest:
      type: object
      required:
        - appID
        - provider
        - token
      properties:
        appID:
          type: string
          description: The application ID
          example: "your-app-id"
        provider:
          type: string
          description: The authentication provider
          example: "auth0"
        token:
          type: string
          description: |
            A JSON string for the token. The schema is described by `DittoAuthToken`.
          example: "{\"token\": \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\", \"transactionId\": \"0123456789\"}"
    AuthorizeResponse:
      type: object
      properties:
        authenticate:
          type: boolean
          description: Whether the authentication was successful
          example: true
        userID:
          type: string
          description: The authenticated user's ID
          example: "user-123"
        expirationSeconds:
          type: integer
          description: Token expiration time in seconds
          example: 3600
        permissions:
          $ref: '#/components/schemas/Permission'
        clientInfo:
          type: object
          nullable: true
          description: Additional client information
        identityServiceMetadata:
          type: object
          nullable: true
          description: Additional identity service metadata

    Permission:
      type: object
      properties:
        read:
          $ref: '#/components/schemas/PermissionRules'
        write:
          $ref: '#/components/schemas/PermissionRules'
        remoteQuery:
          type: boolean
          description: Whether remote queries are allowed
          example: false

    PermissionRules:
      type: object
      properties:
        everything:
          type: boolean
          description: Whether full access is granted
          example: false
        queriesByCollection:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Collection-specific query rules
          example:
            Ledgers:
              - "_id = 'ledger-123'"
            Accounts:
              - "_id.ledgerId = 'ledger-123'"
    DittoAuthToken:
      type: object
      properties:
        accessToken:
          type: string
          description: |
            Freedger access token. It should include the scope "read:ditto_auth".
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        transactionId: 
          type: string
          description: Transaction ID that should be used for retrieving the data.
          example: "0123456789"
